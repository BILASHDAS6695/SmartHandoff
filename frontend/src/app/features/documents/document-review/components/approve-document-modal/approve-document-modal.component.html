<h2 mat-dialog-title>Approve & Sign Document</h2>
<mat-dialog-content>
  <p>
    You are about to approve and electronically sign
    <strong>{{ data.documentTitle }}</strong> for
    <strong>{{ data.patientName }}</strong>.
  </p>
  <p>This document has <strong>{{ data.editCount }}</strong> manual edit(s). Once signed, it will be locked for editing.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="approve()">Approve & Sign</button>
</mat-dialog-actions>

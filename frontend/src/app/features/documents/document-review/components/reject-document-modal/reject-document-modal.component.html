<h2 mat-dialog-title>Return Document to Queue</h2>
<mat-dialog-content>
  <p>Select a reason and add an optional note. The document will be returned for correction.</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Reason</mat-label>
    <mat-select [(ngModel)]="reason">
      @for (r of reasons; track r) {
        <mat-option [value]="r">{{ r }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Note</mat-label>
    <textarea matInput rows="3" [(ngModel)]="note"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="warn" [disabled]="!reason" (click)="confirm()">Return</button>
</mat-dialog-actions>

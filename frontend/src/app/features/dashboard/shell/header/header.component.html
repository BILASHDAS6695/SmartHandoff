<mat-toolbar color="primary">
  <div class="toolbar-content">

    <!-- Left side -->
    <div class="app-brand" routerLink="/dashboard">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
      </div>

      <span class="app-title">SmartHandoff</span>
    </div>

    <!-- Search -->
    <div class="header-search">
      <mat-icon class="search-icon">search</mat-icon>

      <input
        type="text"
        placeholder="Search patients by name or MRN..."
        aria-label="Search"
      />
    </div>

    <!-- Right Side -->
    <div class="header-actions">

      <!-- Notification -->
      <div class="notification-wrapper">
        <button
          mat-icon-button
          class="notification-btn"
          [attr.aria-label]="'Notifications, ' + unreadCount() + ' unread'"
          [matTooltip]="'You have ' + unreadCount() + ' notifications'"
          (click)="toggleNotificationPanel(); $event.stopPropagation()">

          <mat-icon>notifications</mat-icon>

          @if (unreadCount() > 0) {
            <span class="notification-badge" aria-hidden="true">{{ unreadCount() }}</span>
          }

        </button>

        <app-notification-panel
          [isOpen]="isNotificationPanelOpen()"
          [notifications]="notifications()"
          [unreadCount]="unreadCount()"
          (closePanel)="closeNotificationPanel()"
          (notificationClick)="onNotificationClick($event)"
          (markAsRead)="onMarkAsRead($event)"
          (dismiss)="onDismiss($event)"
          (markAllAsRead)="onMarkAllAsRead()">
        </app-notification-panel>
      </div>

      <!-- User -->
      <button
        mat-icon-button
        class="user-menu-trigger"
        [matMenuTriggerFor]="userMenu">

        <span class="user-avatar">
          {{ getUserInitials() }}
        </span>

        <mat-icon class="dropdown-icon">
          arrow_drop_down
        </mat-icon>

      </button>

    </div>

  </div>
</mat-toolbar>

<!-- USER MENU -->

<mat-menu
  #userMenu="matMenu"
  panelClass="user-menu-panel"
  xPosition="before"
  yPosition="below"
  [overlapTrigger]="false">

  <button
    mat-menu-item
    (click)="navigateToProfile()">

    <span>Profile</span>

  </button>

  @if (canSwitchRole()) {
    <button
      mat-menu-item
      (click)="switchRole()">

      <span>Switch Role</span>

    </button>
  }

  <button
    mat-menu-item
    class="sign-out-item"
    (click)="logout()">

    <span>Sign Out</span>

  </button>

</mat-menu>

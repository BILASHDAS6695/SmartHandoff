<mat-sidenav-container>
  <mat-sidenav
    #sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    fixedInViewport
    fixedTopGap="64"
  >
    <app-sidebar (linkClicked)="onSidebarLinkClicked()"></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-header></app-header>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

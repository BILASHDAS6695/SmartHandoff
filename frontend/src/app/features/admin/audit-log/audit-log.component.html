<section class="audit-shell" aria-label="Audit log">
  <!-- Admin sub-nav -->
  <aside class="admin-sidebar">
    <h2>Admin Sections</h2>
    <a class="admin-nav-item" routerLink="/admin">User Management</a>
    <a class="admin-nav-item active" routerLink="/admin/audit-log">Audit Log</a>
    <a class="admin-nav-item" routerLink="/admin/system-configuration">System Configuration</a>
  </aside>

  <!-- Content area -->
  <div class="content">
    <div class="page-header">
      <h1>Audit Log</h1>
      <button class="btn-export" (click)="exportCsv()">Export CSV</button>
    </div>

    <div class="card">
      <div class="filter-row">
        <select id="audit-date" class="filter-select" [(ngModel)]="dateFilter">
          <option value="7">Date: Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="1">Last 24 hours</option>
        </select>

        <select id="audit-user" class="filter-select" [(ngModel)]="userFilter">
          <option value="all">All Users</option>
          <option>d.chen</option>
          <option>n.smith</option>
          <option>m.phil</option>
          <option>c.johnson</option>
          <option>admin</option>
        </select>

        <select id="audit-action" class="filter-select" [(ngModel)]="actionFilter">
          <option value="all">All Event Types</option>
          <option>READ</option>
          <option>WRITE</option>
          <option>SIGN</option>
          <option>LOGIN</option>
        </select>

        <button class="btn-filter" id="audit-apply" (click)="applyFilters()">Apply Filters</button>

        <span class="ann" data-id="UXR-014">PHI masked in all log entries</span>
      </div>

      <div class="results-info">Showing {{ filteredEntries().length }} audit events</div>

      <div class="audit-rows">
        @for (entry of filteredEntries(); track entry.time + entry.user) {
          <div class="audit-row">
            <span class="audit-time">{{ entry.time }}</span>
            <span class="audit-user">{{ entry.user }}</span>
            <span class="audit-action" [class]="getActionClass(entry.action)">{{ entry.action }}</span>
            <span class="audit-target" [innerHTML]="entry.targetHtml"></span>
          </div>
        }
      </div>
    </div>
  </div>
</section>

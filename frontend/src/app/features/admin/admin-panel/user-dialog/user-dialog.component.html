<div class="modal-header">
  <h3>{{ title }}</h3>
  <button class="modal-close" (click)="onCancel()">&times;</button>
</div>

<div class="modal-body">
  <div class="form-group">
    <label for="wf-user-name">Full Name</label>
    <input
      id="wf-user-name"
      type="text"
      [ngModel]="full_name()"
      (ngModelChange)="full_name.set($event)"
      placeholder="e.g. Smith, Nancy" />
  </div>

  <div class="form-group">
    <label for="wf-user-email">Email</label>
    <input
      id="wf-user-email"
      type="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      placeholder="n.smith@hospital.org" />
  </div>

  <div class="form-group">
    <label for="wf-user-role">Role</label>
    <select id="wf-user-role" [ngModel]="role()" (ngModelChange)="role.set($event)">
      @for (roleOption of roles; track roleOption.value) {
        <option [value]="roleOption.value">{{ roleOption.label }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label for="wf-user-unit">Unit Assignment</label>
    <select id="wf-user-unit" [ngModel]="unit()" (ngModelChange)="unit.set($event)">
      @for (unitOption of units; track unitOption) {
        <option [value]="unitOption">{{ unitOption }}</option>
      }
    </select>
  </div>
</div>

<div class="modal-footer">
  <button class="btn-secondary" (click)="onCancel()">Cancel</button>
  <button class="btn-primary" [disabled]="!isValid()" (click)="onSave()">Save User</button>
</div>
